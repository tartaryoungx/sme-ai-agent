name: CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install Packages
        run: |
          pip install -r requirements.txt

      - name: Test
        run: |
          echo "CI Working"